description: A mobile application for managing wine collections across multiple storage locations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <3.0.0'
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Camera & ML Kit (temporarily removed for build compatibility)
  # camera: ^0.10.5
  # google_mlkit_text_recognition: ^0.9.0
  # image_picker: ^0.8.7
  
  # State Management
  flutter_bloc: ^8.1.2
  equatable: ^2.0.5
  
  # UI Components
  cupertino_icons: ^1.0.2
  
  # Utilities
  intl: ^0.18.1
  path_provider: ^2.0.14
  shared_preferences: ^2.0.18
  
  # HTTP & Networking
  http: ^0.13.5
  
  # Image Processing
  image: ^4.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  
